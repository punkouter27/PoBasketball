[project]
name = "streetball"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3",
    "mujoco-warp>=4.0.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "torch==2.14.1",
    "tqdm>=4.70.1",
    "warp-lang>=1.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
