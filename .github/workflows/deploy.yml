name: Test & Deploy Web Viewer

# Push to master -> GitHub-hosted runner: CPU sim tests, bake the golden replays into the web viewer
# (web/build.py), deploy it to the Azure Static Web App `pobasketball` (rg PoBasketball), check the live page.
# Pull requests get the tests and the build, never a deploy. No self-hosted runner: the Unreal project is
# not built here (GitHub's runners have no Unreal Engine); test_env / test_determinism need CUDA and stay local.
#
# Repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN (the Static Web App's deployment token).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # mujoco pinned to sim/uv.lock; the CPU tests need nothing else.
      - name: Install CPU dependencies
        run: python -m pip install "mujoco==4.0.0" numpy pytest

      - name: Sim tests (CPU)
        working-directory: sim
        run: python -m pytest -q tests/test_stand.py tests/test_penetration.py

      - name: Build the web viewer
        run: python web/build.py

      - name: Deploy to Azure Static Web Apps
        id: deploy
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true

      - name: Check the live page
        if: steps.deploy.outcome == 'success'
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 "$URL/data/replays.json" | grep -q '"frames"'; then echo "Live: $URL"; exit 0; fi
            sleep 15
          done
          echo "$URL did not serve the viewer"; exit 1
