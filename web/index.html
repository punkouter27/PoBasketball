<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoBasketball Replays</title>
<style>
  :root { --bg: #14161a; --panel: rgba(20, 22, 26, 0.86); --text: #e8e6e1; --muted: #9a978f; --accent: #f08a24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; padding: 10px 12px; background: var(--panel); border-radius: 10px; }
  .bar select, .bar button { background: #262a31; color: var(--text); border: 1px solid #3a3f48; border-radius: 6px;
    padding: 6px 10px; font: inherit; cursor: pointer; }
  .bar button:hover, .bar select:hover { border-color: var(--accent); }
  #scrub { flex: 1 1 160px; accent-color: var(--accent); }
  #info { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9em; }
  h1 { position: fixed; top: 12px; left: 16px; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .stamp { position: fixed; right: 8px; top: 8px; color: var(--muted); font-size: 11px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 16px; text-align: center; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<h1>PoBasketball <span id="title">replays</span></h1>
<div class="bar">
  <select id="replay" aria-label="Replay"></select>
  <button id="play" aria-label="Play or pause">Pause</button>
  <select id="speed" aria-label="Speed">
    <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
  </select>
  <button id="follow" aria-pressed="true">Follow</button>
  <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame">
  <span id="info"></span>
</div>
<div id="err"></div>
<div class="stamp">dev</div>
<script type="module" src="app.js"></script>
</body>
</html>
